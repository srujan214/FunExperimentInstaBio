<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End | Srujan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;600&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           BASE VARIABLES & RESET (SELF-CONTAINED)
           ========================================= */
        :root {
            --bg-dark: #0a0a0f;
            --text-primary: #f2ebd9;
            --text-secondary: #a8a09a;
            --accent-red: #a62b2b;
            --accent-gold: #c7a15d;
            --font-handwritten: 'Caveat', cursive;
            --font-serif: 'Merriweather', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .goodbye-body {
            background: url('assets/images/goodbye-bg.webp') no-repeat center center/cover;
            background-color: #0d0f14; 
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
        }

        .goodbye-body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,15,0.4), rgba(10,10,15,0.8) 70%, rgba(5,5,10,0.95));
            z-index: 1;
            pointer-events: none;
        }

        /* =========================================
           NAVIGATION & AUDIO PLAYER
           ========================================= */
        .goodbye-nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
        }

        .nav-logo {
            font-family: var(--font-handwritten);
            font-size: 2rem;
            color: var(--text-primary);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-logo span { color: var(--accent-red); font-size: 1.2rem; }

        .custom-audio-player {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(232, 224, 213, 0.2);
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            gap: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .audio-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: rgba(232, 224, 213, 0.8);
        }

        .audio-play-btn {
            background: transparent;
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .audio-play-btn:hover { background: var(--accent-red); color: white; }

        .waveform { display: flex; align-items: center; gap: 3px; height: 20px; }
        .bar { width: 3px; background: rgba(232, 224, 213, 0.3); border-radius: 2px; height: 20%; transition: height 0.2s ease; }
        
        .custom-audio-player.playing .bar { animation: wave 1.2s ease-in-out infinite; background: var(--accent-gold); }
        .custom-audio-player.playing .bar:nth-child(2) { animation-delay: 0.2s; }
        .custom-audio-player.playing .bar:nth-child(3) { animation-delay: 0.4s; }
        .custom-audio-player.playing .bar:nth-child(4) { animation-delay: 0.1s; }
        .custom-audio-player.playing .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes wave { 0%, 100% { height: 20%; } 50% { height: 100%; } }

        .back-home-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(232, 224, 213, 0.2);
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .back-home-btn:hover { background: rgba(232, 224, 213, 0.1); border-color: var(--accent-gold); }

        /* =========================================
           MAIN CONTENT
           ========================================= */
        .goodbye-main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            margin-top: -5vh;
        }

        .main-title {
            font-family: var(--font-handwritten);
            font-size: 7rem;
            line-height: 1;
            margin-bottom: 2rem;
            position: relative;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .main-title .white { color: var(--text-primary); }
        .main-title .red { color: var(--accent-red); }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: var(--accent-red);
            border-radius: 2px;
            transform: rotate(-2deg);
            box-shadow: 0 0 15px rgba(166, 43, 43, 0.6);
        }

        .quote-text {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            color: var(--text-primary);
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .torii-divider { color: var(--accent-red); font-size: 1.5rem; margin: 1rem 0; opacity: 0.8; }

        .sub-message {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: rgba(232, 224, 213, 0.8);
            max-width: 700px;
            line-height: 1.8;
            margin-bottom: 3rem;
        }

        /* =========================================
           BUTTONS & SECRET
           ========================================= */
        .action-buttons { display: flex; gap: 2rem; align-items: center; }

        .cinematic-btn {
            background: rgba(26, 26, 30, 0.7);
            border: 1px solid rgba(166, 43, 43, 0.5);
            color: var(--text-primary);
            padding: 1rem 2.5rem;
            border-radius: 5px;
            font-family: var(--font-serif);
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .cinematic-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(45deg, transparent, rgba(166, 43, 43, 0.3), transparent);
            transform: translateX(-100%); transition: transform 0.5s ease;
        }
        .cinematic-btn:hover { border-color: var(--accent-red); box-shadow: 0 0 20px rgba(166, 43, 43, 0.4); transform: translateY(-2px); }
        .cinematic-btn:hover::before { transform: translateX(100%); }

        .bottom-text {
            position: absolute; bottom: 2rem;
            font-family: var(--font-serif); font-size: 0.9rem;
            color: rgba(232, 224, 213, 0.5); letter-spacing: 2px; z-index: 10;
        }

        .secret-corner-btn { 
            position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; 
            border-radius: 50%; background: transparent; border: 1px dashed rgba(232, 224, 213, 0.2); 
            color: rgba(232, 224, 213, 0.2); cursor: pointer; z-index: 100; transition: all 0.3s; 
        }
        .secret-corner-btn:hover { color: var(--accent-red); border-color: var(--accent-red); transform: scale(1.1) rotate(10deg); }

        /* Animations */
        .fade-up { opacity: 0; transform: translateY(30px); animation: fadeUpAnim 1s forwards; }
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1s; }
        .delay-3 { animation-delay: 1.5s; }
        .delay-4 { animation-delay: 2s; }
        @keyframes fadeUpAnim { to { opacity: 1; transform: translateY(0); } }
        
        .hidden { display: none !important; }

        /* Fullscreen Video Overlay */
        .fullscreen-video-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .fullscreen-video { width: 100%; height: 100%; object-fit: contain; }
        .close-overlay-btn { position: absolute; top: 20px; right: 30px; font-size: 3rem; background: transparent; border: none; color: var(--accent-red); cursor: pointer; z-index: 10000; }

        /* Sakura */
        .sakura-petal {
            position: fixed; top: -20px;
            background: linear-gradient(135deg, #ffb7c5, #e8a0a8);
            border-radius: 100% 0px 100% 0px;
            opacity: 0.6; pointer-events: none; z-index: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translate(15vw, 110vh) rotate(720deg); opacity: 0; }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .goodbye-nav { padding: 1rem; flex-direction: column; gap: 1rem; }
            .nav-logo { font-size: 1.5rem; }
            .custom-audio-player { width: 100%; justify-content: space-between; }
            .back-home-btn { display: none; }
            .main-title { font-size: 4.5rem; }
            .quote-text { font-size: 1.1rem; }
            .sub-message { font-size: 0.95rem; }
            .action-buttons { flex-direction: column; width: 100%; gap: 1rem; }
            .cinematic-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body class="goodbye-body">

    <div id="sakura-container"></div>

    <!-- FULLSCREEN VIDEO OVERLAY -->
    <div id="video-overlay" class="fullscreen-video-overlay hidden">
        <button id="close-video-overlay" class="close-overlay-btn">&times;</button>
        <video id="fullscreen-video" class="fullscreen-video" playsinline></video>
    </div>

    <!-- TOP NAVIGATION -->
    <nav class="goodbye-nav">
        <div class="nav-logo">Srujan <span>— 夢</span></div>
        
        <div class="custom-audio-player" id="audio-player-ui">
            <div class="audio-info">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                <span>Farewell.mp3</span>
            </div>
            <div class="waveform">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <button class="audio-play-btn" id="custom-play-btn">
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <a href="index.html" class="back-home-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Back Home
        </a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="goodbye-main">
        <h1 class="main-title fade-up"><span class="white">The</span> <span class="red">End.</span></h1>
        
        <p class="quote-text fade-up delay-1">
            <span style="font-size: 2rem; color: var(--accent-gold);">“</span> 
            You've reached the final page. The silence here is peaceful, isn't it? 
            <span style="font-size: 2rem; color: var(--accent-gold);">”</span>
        </p>

        <div class="torii-divider fade-up delay-2">⛩</div>

        <p class="sub-message fade-up delay-2">
            Thank you for witnessing my beautiful mistake.<br>You may now return to your regularly scheduled programming.
        </p>

        <div class="action-buttons fade-up delay-3">
            <!-- NEW APOLOGY BUTTON -->
            <button id="play-apology" class="cinematic-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                Accept My Apology
            </button>
            
            <a href="index.html" class="cinematic-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Return to Reality
            </a>
        </div>
    </main>

    <p class="bottom-text fade-up delay-4">また、いつか…</p>
    
    <button id="secret-btn" class="secret-corner-btn" title="Do not click this.">?</button>

    <audio id="global-audio"></audio>
    
    <!-- SCRIPTS FOR THIS PAGE ONLY -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==========================================
            // 1. Top Audio Player (Farewell.mp3)
            // ==========================================
            const customPlayBtn = document.getElementById('custom-play-btn');
            const audioPlayerUI = document.getElementById('audio-player-ui');
            const globalAudio = document.getElementById('global-audio');
            const audioSrc = 'assets/audio/goodbye.mp3';

            function toggleAudio() {
                if (globalAudio.paused) {
                    globalAudio.src = audioSrc;
                    globalAudio.play().then(() => {
                        audioPlayerUI.classList.add('playing');
                        updateIcons(true);
                    }).catch(err => console.warn("Audio missing:", err));
                } else {
                    globalAudio.pause();
                    audioPlayerUI.classList.remove('playing');
                    updateIcons(false);
                }
            }

            function updateIcons(isPlaying) {
                document.querySelectorAll('.icon-play').forEach(icon => icon.classList.toggle('hidden', isPlaying));
                document.querySelectorAll('.icon-pause').forEach(icon => icon.classList.toggle('hidden', !isPlaying));
            }

            if(customPlayBtn) customPlayBtn.addEventListener('click', toggleAudio);

            globalAudio.addEventListener('ended', () => {
                audioPlayerUI.classList.remove('playing');
                updateIcons(false);
            });

            // ==========================================
            // 2. Fullscreen Video Logic (Apology & Secret)
            // ==========================================
            const videoOverlay = document.getElementById('video-overlay');
            const fullscreenVideo = document.getElementById('fullscreen-video');
            const closeVideoBtn = document.getElementById('close-video-overlay');

            function playVideo(src, showControls) {
                videoOverlay.classList.remove('hidden');
                fullscreenVideo.src = src;
                fullscreenVideo.controls = showControls;
                fullscreenVideo.currentTime = 0;
                fullscreenVideo.play().catch(e => {
                    console.warn("Video missing:", e);
                    videoOverlay.classList.add('hidden');
                });
            }

            // Apology Button
            const apologyBtn = document.getElementById('play-apology');
            if (apologyBtn) {
                apologyBtn.addEventListener('click', () => {
                    playVideo('assets/videos/apology.mp4', true); // true = show controls
                });
            }

            // Secret Button
            const secretBtn = document.getElementById('secret-btn');
            if (secretBtn) {
                secretBtn.addEventListener('click', () => {
                    playVideo('assets/videos/video_secret.mp4', false); // false = NO controls
                });
            }

            // Close Video Overlay
            if (closeVideoBtn) {
                closeVideoBtn.addEventListener('click', () => {
                    videoOverlay.classList.add('hidden');
                    fullscreenVideo.pause();
                });
            }

            // ==========================================
            // 3. Sakura Petals
            // ==========================================
            const container = document.getElementById('sakura-container');
            if (container && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const petalCount = window.innerWidth < 768 ? 15 : 30;
                for (let i = 0; i < petalCount; i++) {
                    const petal = document.createElement('div');
                    petal.classList.add('sakura-petal');
                    const size = Math.random() * 12 + 6;
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size}px`;
                    petal.style.left = `${Math.random() * 100}vw`;
                    petal.style.animationDuration = `${Math.random() * 8 + 6}s`;
                    petal.style.animationDelay = `-${Math.random() * 10}s`;
                    container.appendChild(petal);
                }
            }
        });
    </script>
</body>
</html>
