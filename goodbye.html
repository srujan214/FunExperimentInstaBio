<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye | Srujan</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: url('assets/images/goodbye-bg.webp');
            background-size: cover; background-position: center;
            background-color: rgba(18, 18, 18, 0.85); background-blend-mode: overlay;
            height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .goodbye-content { z-index: 10; padding: 2rem; max-width: 800px; }
        .goodbye-content h1 { font-family: 'Caveat', cursive; font-size: 5rem; color: #A62B2B; margin-bottom: 1rem; }
        .warning-box { display: none; margin-top: 2rem; padding: 1.5rem; border: 1px dashed #A62B2B; background: rgba(26, 26, 26, 0.8); }
    </style>
</head>
<body>
    <div id="sakura-container"></div>
    <div class="goodbye-content">
        <h1>BYE, LOWDE.</h1>
        <p class="subtitle">Your visit has been recorded by absolutely nobody.<br>Thank you for contributing nothing to this website.</p>
        <button id="leave-btn" class="vintage-btn" style="margin-top: 2rem;">LEAVE THIS PLACE</button>
        <div id="warning-box" class="warning-box">
            <p>Wait... you actually clicked it? I was hoping you'd stay and suffer with me.</p>
            <a href="index.html" class="vintage-btn mt-2" style="display: inline-block; text-decoration: none;">Take Me Back to the Misery</a>
        </div>
    </div>
    <audio id="global-audio"></audio>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const leaveBtn = document.getElementById('leave-btn');
            const warningBox = document.getElementById('warning-box');
            leaveBtn.addEventListener('click', () => {
                window.audioManager.play('assets/audio/audio6.mp3', leaveBtn);
                warningBox.style.display = 'block';
                leaveBtn.style.display = 'none';
            });
        });
    </script>
</body>
</html>
